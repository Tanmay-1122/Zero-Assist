[package]
name = "zeroclaw-mcp-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Zero Engineering Gateway — generic MCP Streamable HTTP reverse proxy with modular backend adapters"

[[bin]]
name = "zeroclaw-mcp-gateway"
path = "src/main.rs"

[lib]
name = "zeroclaw_mcp_gateway"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
toml = "1.0"
async-trait = "0.1"
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
http-body-util = "0.1"
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
