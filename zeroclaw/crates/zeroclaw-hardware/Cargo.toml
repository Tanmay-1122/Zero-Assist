[package]
name = "zeroclaw-hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hardware discovery, peripherals, and device management for ZeroClaw."
publish = false

[dependencies]
zeroclaw-api.workspace = true
zeroclaw-config.workspace = true

anyhow        = "1.0"
async-trait   = "0.1"
directories   = "6.0"
serde         = { version = "1.0", default-features = false, features = ["derive"] }
serde_json    = { version = "1.0", default-features = false, features = ["std"] }
thiserror     = "2.0"
tokio         = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs"] }
tempfile      = "3.26"
toml          = "1.0"
tracing       = { version = "0.1", default-features = false }

# Optional: only compiled when `hardware` feature is enabled
tokio-serial  = { version = "5.4", optional = true }
which         = { version = "8.0", optional = true }

[features]
default = []
hardware = ["dep:tokio-serial", "dep:which"]
peripheral-rpi = []
dev-sim = []

