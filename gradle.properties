org.gradle.jvmargs=-Xmx5g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Some AndroidX libraries (for example WorkManager and Startup) resolve their own
# generated R classes at runtime. Keeping transitive R classes enabled ensures
# those dependency R stubs are materialized into the packaged app.
android.nonTransitiveRClass=false
# Prefer in-process Kotlin compilation to avoid flaky daemon/cache registration
# failures seen during local Android Studio and Gradle builds on this repo.
kotlin.compiler.execution.strategy=in-process
# Speed up build: only compile for phone ABIs (armeabi-v7a, arm64-v8a), skip x86/x86_64 emulators
zeroAssist.phoneOnlyAbi=true
# For fastest dev builds, you can also configure Rust to build in parallel
org.gradle.parallel=true
org.gradle.workers.max=4
